<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUNCH - Arcade Roguelike</title>

  <!-- Fontes do projeto -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">

  <!-- CSS e Javascript -->
  <link rel="stylesheet" href="./styles/menu.css">
  <script src="./src/menu.js"></script>
</head>
<body>

  <!-- Layout superior -->
  <header class="top-header">
    <div class="title-wrapper">
      <h1 class="brand-title">MUNCH</h1>
      <span class="brand-subtitle">ROGUELIKE ARCADE</span>

      <!-- Menu principal -->
      <nav class="button-group" aria-label="Menu Principal">
        <button class="btn btn-play">Jogar</button>
        <button class="btn btn-secondary">Baralho / Slimes</button>
        <button class="btn btn-secondary">Estatísticas</button>
        <button class="btn btn-secondary">Opções</button>
      </nav>
    </div>

    <!-- Painel lateral direito -->
    <div class="right-column">
      <!-- Placar de recordes -->
      <aside class="arcade-stats">
        <div class="stat-box">
          <span class="stat-label">Best Run</span>
          <span class="stat-value">1,420,500</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">Max Multi</span>
          <span class="stat-value">x32</span>
        </div>
      </aside>

      <!-- Card holográfico do slime -->
      <div class="holo-card-wrapper">
        <div class="holo-card comum">
          <div class="holo-glare"></div>

          <div class="relic-card-header">
            <div class="relic-card-pill">[ <span class="pill-rarity">COMMON</span> // <span class="pill-category">STARTER</span> ]</div>
          </div>

          <div class="relic-card-icon-container">
            <div class="relic-card-icon-ring">
              <!-- Desenho do slime -->
              <svg class="holo-card-slime" viewBox="0 0 160 160" fill="none">
                <rect x="5" y="5" width="150" height="150" rx="20" ry="20" fill="#9e9e9e" stroke="#ffffff" stroke-width="6"/>
                <g>
                  <path d="M 22 46 L 68 64" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
                  <path d="M 138 46 L 92 64" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
                  <polygon points="26,66 66,78 26,84" fill="#ffffff"/>
                  <circle cx="52" cy="77" r="5.5" fill="#1a1a1a"/>
                  <polygon points="134,66 94,78 134,84" fill="#ffffff"/>
                  <circle cx="108" cy="77" r="5.5" fill="#1a1a1a"/>
                </g>
                <circle cx="75" cy="92" r="2.5" fill="#ffffff"/>
                <circle cx="85" cy="92" r="2.5" fill="#ffffff"/>
                <rect x="48" y="105" width="64" height="17" rx="3" fill="#1a1a1a" stroke="#ffffff" stroke-width="3"/>
                <polygon points="56,105 63,114 70,105" fill="#ffffff"/>
                <polygon points="73,105 80,114 87,105" fill="#ffffff"/>
                <polygon points="90,105 97,114 104,105" fill="#ffffff"/>
              </svg>
            </div>
          </div>

          <div class="relic-card-name">SLIME RABUGENTO</div>

          <!-- Descrição da carta -->
          <div class="relic-card-desc-box">
            <div class="card-stat-badge-wrapper">
              <div class="card-stat-pill blue"><span class="pill-value">+1</span> Pulo &amp; Disparo</div>
            </div>
            <div class="relic-card-desc-text">Slime rabugento inicial com 100 Fichas Base e pulo ativado.</div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Animação decorativa no rodapé -->
  <section class="runner-track" aria-hidden="true">
    <div class="dots-trail"></div>

    <div class="chase-group">
      <!-- Desenho do slime de perfil -->
      <div class="slime-wrapper">
        <svg class="slime-character" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="6" y="8" width="82" height="82" rx="18" fill="#9E9E9E" stroke="#FFFFFF" stroke-width="8"/>
          <rect x="42" y="24" width="38" height="7" rx="3.5" fill="#FFFFFF" transform="rotate(24 42 24)"/>
          <polygon points="56,39 76,46 56,54" fill="#FFFFFF"/>
          <circle cx="68" cy="46" r="4.5" fill="#000000"/>
          <path d="M 50 64 L 88 64 L 88 78 L 50 78 Z" fill="#000000" stroke="#FFFFFF" stroke-width="3"/>
          <polygon points="52,64 58,70 64,64" fill="#FFFFFF"/>
          <polygon points="65,64 71,70 77,64" fill="#FFFFFF"/>
          <polygon points="78,64 84,70 88,64" fill="#FFFFFF"/>
          <polygon points="58,78 64,72 70,78" fill="#FFFFFF"/>
          <polygon points="71,78 77,72 83,78" fill="#FFFFFF"/>
          <line x1="22" y1="28" x2="30" y2="28" stroke="#7A7A7A" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </div>

      <!-- Carta fugindo -->
      <div class="card-target">
        <div class="card-corner">♠ x4</div>
        <div class="card-center">★</div>
        <div class="card-corner" style="text-align: right;">♠</div>
      </div>
    </div>
  </section>

  <!-- Rodapé de informações -->
  <footer class="footer-info">
    <span>BUILD 2026.1 // DESKTOP EDITION</span>
    <span>[↑↓] NAVEGAR &nbsp;&nbsp; [ENTER] CONFIRMAR</span>
  </footer>

</body>
</html>
