<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUNCH — Carregando...</title>
  <link rel="icon" id="dynamic-favicon" type="image/png" href="">
  <link rel="stylesheet" href="./styles/loading.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #000000;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
  </style>
</head>
<body>

  <!-- Tela de carregamento cheia -->
  <div id="loading-screen" class="loading-screen">
    <!-- Efeito de impacto do slime -->
    <div class="shockwave-ring" id="loading-shockwave"></div>

    <!-- Poeira levantada no impacto -->
    <div class="dust-container" id="loading-dust">
      <div class="dust-particle dp1"></div>
      <div class="dust-particle dp2"></div>
      <div class="dust-particle dp3"></div>
      <div class="dust-particle dp4"></div>
      <div class="dust-particle dp5"></div>
      <div class="dust-particle dp6"></div>
    </div>

    <!-- Slime central grande -->
    <div class="central-slime-wrapper" id="central-slime-wrapper">
      <div class="slime-cube-big" id="big-slime">
        <svg viewBox="0 0 160 160" width="100%" height="100%">
          <rect x="5" y="5" width="150" height="150" rx="20" ry="20" fill="#9e9e9e" stroke="#ffffff" stroke-width="6" />
          <g class="slime-eyes">
            <!-- Olhos e sobrancelhas bravas -->
            <path d="M 22 46 L 68 64" stroke="#ffffff" stroke-width="7" stroke-linecap="round" />
            <path d="M 138 46 L 92 64" stroke="#ffffff" stroke-width="7" stroke-linecap="round" />
            <polygon points="26,66 66,78 26,84" fill="#ffffff" />
            <circle cx="52" cy="77" r="5.5" fill="#1a1a1a" />
            <polygon points="134,66 94,78 134,84" fill="#ffffff" />
            <circle cx="108" cy="77" r="5.5" fill="#1a1a1a" />
          </g>
          <!-- Detalhes do rosto -->
          <circle cx="75" cy="92" r="2.5" fill="#ffffff" />
          <circle cx="85" cy="92" r="2.5" fill="#ffffff" />
          <rect x="48" y="105" width="64" height="17" rx="3" fill="#1a1a1a" stroke="#ffffff" stroke-width="3" />
          <polygon points="56,105 63,114 70,105" fill="#ffffff" />
          <polygon points="73,105 80,114 87,105" fill="#ffffff" />
          <polygon points="90,105 97,114 104,105" fill="#ffffff" />
        </svg>
      </div>
    </div>

    <!-- Instrução para começar -->
    <div class="start-prompt" id="start-prompt">
      PRESS ANY KEY OR CLICK TO START
    </div>

    <!-- Indicador de carregamento no rodapé -->
    <div class="bottom-right-loader" id="bottom-right-loader">
      <span class="loading-text-label">LOADING...</span>
      <div class="mini-slimes-container">
        <!-- Mini Slime 1 -->
        <div class="mini-slime ms1">
          <svg viewBox="0 0 48 48" width="100%" height="100%">
            <rect x="2" y="2" width="44" height="44" rx="6" ry="6" fill="#a3a3a3" stroke="#ffffff" stroke-width="3" />
            <path d="M 7 14 L 21 19" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
            <path d="M 41 14 L 27 19" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
            <polygon points="8,20 20,24 8,26" fill="#ffffff" />
            <circle cx="16" cy="24" r="1.8" fill="#1a1a1a" />
            <polygon points="40,20 28,24 40,26" fill="#ffffff" />
            <circle cx="32" cy="24" r="1.8" fill="#1a1a1a" />
            <circle cx="22" cy="29" r="0.8" fill="#ffffff" />
            <circle cx="26" cy="29" r="0.8" fill="#ffffff" />
            <rect x="14" y="32" width="20" height="6" rx="1" fill="#1a1a1a" stroke="#ffffff" stroke-width="1.5" />
            <polygon points="17,32 20,36 23,32" fill="#ffffff" />
            <polygon points="25,32 28,36 31,32" fill="#ffffff" />
          </svg>
          <div class="mini-dust md1"></div>
          <div class="mini-dust md2"></div>
        </div>
        <!-- Mini Slime 2 -->
        <div class="mini-slime ms2">
          <svg viewBox="0 0 48 48" width="100%" height="100%">
            <rect x="2" y="2" width="44" height="44" rx="6" ry="6" fill="#a3a3a3" stroke="#ffffff" stroke-width="3" />
            <path d="M 7 14 L 21 19" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
            <path d="M 41 14 L 27 19" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
            <polygon points="8,20 20,24 8,26" fill="#ffffff" />
            <circle cx="16" cy="24" r="1.8" fill="#1a1a1a" />
            <polygon points="40,20 28,24 40,26" fill="#ffffff" />
            <circle cx="32" cy="24" r="1.8" fill="#1a1a1a" />
            <circle cx="22" cy="29" r="0.8" fill="#ffffff" />
            <circle cx="26" cy="29" r="0.8" fill="#ffffff" />
            <rect x="14" y="32" width="20" height="6" rx="1" fill="#1a1a1a" stroke="#ffffff" stroke-width="1.5" />
            <polygon points="17,32 20,36 23,32" fill="#ffffff" />
            <polygon points="25,32 28,36 31,32" fill="#ffffff" />
          </svg>
          <div class="mini-dust md1"></div>
          <div class="mini-dust md2"></div>
        </div>
        <!-- Mini Slime 3 -->
        <div class="mini-slime ms3">
          <svg viewBox="0 0 48 48" width="100%" height="100%">
            <rect x="2" y="2" width="44" height="44" rx="6" ry="6" fill="#a3a3a3" stroke="#ffffff" stroke-width="3" />
            <path d="M 7 14 L 21 19" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
            <path d="M 41 14 L 27 19" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
            <polygon points="8,20 20,24 8,26" fill="#ffffff" />
            <circle cx="16" cy="24" r="1.8" fill="#1a1a1a" />
            <polygon points="40,20 28,24 40,26" fill="#ffffff" />
            <circle cx="32" cy="24" r="1.8" fill="#1a1a1a" />
            <circle cx="22" cy="29" r="0.8" fill="#ffffff" />
            <circle cx="26" cy="29" r="0.8" fill="#ffffff" />
            <rect x="14" y="32" width="20" height="6" rx="1" fill="#1a1a1a" stroke="#ffffff" stroke-width="1.5" />
            <polygon points="17,32 20,36 23,32" fill="#ffffff" />
            <polygon points="25,32 28,36 31,32" fill="#ffffff" />
          </svg>
          <div class="mini-dust md1"></div>
          <div class="mini-dust md2"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Fluxo de carregamento: animação inicial, queda com impacto e redirecionamento -->
  <script>
    window.addEventListener('DOMContentLoaded', function () {
      var overlay       = document.getElementById('loading-screen');
      var shockwave     = document.getElementById('loading-shockwave');
      var dust          = document.getElementById('loading-dust');
      var bigSlime      = document.getElementById('central-slime-wrapper');
      var startPrompt   = document.getElementById('start-prompt');
      var bottomLoader  = document.getElementById('bottom-right-loader');

      var readyToStart = false;

      // Favicon animado no navegador
      var canvas = document.createElement('canvas');
      canvas.width = 32;
      canvas.height = 32;
      var ctx = canvas.getContext('2d');
      
      var faviconLink = document.getElementById('dynamic-favicon');
      if (!faviconLink) {
        faviconLink = document.createElement('link');
        faviconLink.id = 'dynamic-favicon';
        faviconLink.rel = 'icon';
        faviconLink.type = 'image/png';
        document.head.appendChild(faviconLink);
      }
      
      var animationInterval = null;
      var titleInterval = null;
      var time = 0;
      
      function drawSlimeFrame(yOffset, squishX, squishY) {
        ctx.clearRect(0, 0, 32, 32);
        ctx.save();
        ctx.translate(16, 18 + yOffset);
        ctx.scale(squishX, squishY);
        
        ctx.beginPath();
        ctx.roundRect(-8, -8, 16, 16, 3);
        ctx.fillStyle = '#9e9e9e';
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2.5;
        ctx.stroke();
        
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-6, -4);
        ctx.lineTo(-2, -2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(6, -4);
        ctx.lineTo(2, -2);
        ctx.stroke();
        
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(-6, -1);
        ctx.lineTo(-2, 1);
        ctx.lineTo(-6, 2);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(6, -1);
        ctx.lineTo(2, 1);
        ctx.lineTo(6, 2);
        ctx.closePath();
        ctx.fill();
        
        ctx.fillStyle = '#1a1a1a';
        ctx.fillRect(-4, 0, 1.2, 1.2);
        ctx.fillRect(3, 0, 1.2, 1.2);
        
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(-1, 3, 0.8, 0.8);
        ctx.fillRect(1, 3, 0.8, 0.8);
        
        ctx.fillStyle = '#1a1a1a';
        ctx.fillRect(-3, 5, 6, 2);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 0.5;
        ctx.strokeRect(-3, 5, 6, 2);
        
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(-2, 5);
        ctx.lineTo(-1, 6);
        ctx.lineTo(0, 5);
        ctx.closePath();
        ctx.fill();
        
        ctx.restore();
        faviconLink.href = canvas.toDataURL('image/png');
      }
      
      // Favicon estático após o término do carregamento
      function setStaticFavicon() {
        if (animationInterval) clearInterval(animationInterval);
        if (titleInterval) clearInterval(titleInterval);
        document.title = 'MUNCH';
        
        ctx.clearRect(0, 0, 32, 32);
        ctx.save();
        ctx.translate(16, 16);
        
        ctx.beginPath();
        ctx.roundRect(-9, -9, 18, 18, 3.5);
        ctx.fillStyle = '#9e9e9e';
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2.5;
        ctx.stroke();
        
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.8;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-7, -4.5);
        ctx.lineTo(-2, -2.5);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(7, -4.5);
        ctx.lineTo(2, -2.5);
        ctx.stroke();
        
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(-7, -1);
        ctx.lineTo(-2.5, 1.2);
        ctx.lineTo(-7, 2.5);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(7, -1);
        ctx.lineTo(2.5, 1.2);
        ctx.lineTo(7, 2.5);
        ctx.closePath();
        ctx.fill();
        
        ctx.fillStyle = '#1a1a1a';
        ctx.fillRect(-5, 0.2, 1.5, 1.5);
        ctx.fillRect(3.5, 0.2, 1.5, 1.5);
        
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(-1.2, 3.5, 0.8, 0.8);
        ctx.fillRect(0.8, 3.5, 0.8, 0.8);
        
        ctx.fillStyle = '#1a1a1a';
        ctx.fillRect(-4, 5.5, 8, 2.5);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 0.6;
        ctx.strokeRect(-4, 5.5, 8, 2.5);
        
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(-2.5, 5.5);
        ctx.lineTo(-1, 7);
        ctx.lineTo(0.5, 5.5);
        ctx.closePath();
        ctx.fill();
        
        ctx.restore();
        faviconLink.href = canvas.toDataURL('image/png');
      }
      
      // Animação de pulo do slime no favicon
      animationInterval = setInterval(function () {
        time += 0.22;
        var yOffset = -Math.abs(Math.sin(time)) * 5;
        
        var squishX = 1;
        var squishY = 1;
        var sinVal = Math.sin(time);
        var cosVal = Math.cos(time);
        
        if (Math.abs(sinVal) < 0.3) {
          squishX = 1.2;
          squishY = 0.8;
        } else {
          if (cosVal > 0) {
            squishX = 0.9;
            squishY = 1.1;
          } else {
            squishX = 0.95;
            squishY = 1.05;
          }
        }
        drawSlimeFrame(yOffset, squishX, squishY);
      }, 125);
      
      var dotCount = 0;
      titleInterval = setInterval(function () {
        dotCount = (dotCount + 1) % 4;
        var dots = '.'.repeat(dotCount);
        document.title = 'MUNCH — Carregando' + dots;
      }, 500);

      function goToGame() {
        if (!readyToStart) return;
        readyToStart = false;
        window.removeEventListener('keydown', goToGame);
        window.removeEventListener('click', goToGame);

        overlay.classList.add('exit-fade');

        setTimeout(function () {
          window.location.href = 'menu.html';
        }, 500);
      }

      // Conclui o carregamento após 3 segundos
      setTimeout(function () {
        setStaticFavicon();

        bottomLoader.classList.add('fade-out');
        bigSlime.classList.add('fall-impact');

        // Efeito de colisão e tremor após o impacto
        setTimeout(function () {
          overlay.classList.add('shake-active');
          setTimeout(function () {
            overlay.classList.remove('shake-active');
          }, 150);
          shockwave.classList.add('shockwave-active');
          dust.classList.add('dust-active');
        }, 360);

        // Habilita a entrada para o menu principal
        setTimeout(function () {
          startPrompt.classList.add('visible');
          readyToStart = true;
          window.addEventListener('keydown', goToGame);
          window.addEventListener('click', goToGame);
        }, 800);

      }, 3000);
    });
  </script>
</body>
</html>
